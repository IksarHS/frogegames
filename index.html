<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Froge, LLC | A small game studio in California</title>
<meta name="description" content="Froge, LLC is a small game studio in California. We're making games with our favorite people.">
<link rel="canonical" href="https://frogegames.com/">
<meta name="theme-color" content="#1a1b1d">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="fonts/gabarito.woff2" as="font" type="font/woff2" crossorigin>

<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Organization","name":"Froge","legalName":"Froge, LLC","url":"https://frogegames.com/","email":"dean@frogegames.com","description":"A small game studio in California."}
</script>
</head>
<body>
<div class="bursts" aria-hidden="true"></div>
<main>
  <div class="logo" role="img" aria-label="Froge"><span class="froge-logo" aria-hidden="true"><span class="strut"></span>frog<span class="e">e</span><span class="dot"><svg class="layer layer-sea" viewBox="0 0 100 100"><path fill="#a6e3d0" transform="translate(-11 -10)" d="M42 4C60 6 96 22 97 48C98 62 80 96 50 97C28 98 2 80 3 56C4 40 22 2 42 4Z"/></svg><svg class="layer layer-orange" viewBox="0 0 100 100"><path fill="#f25c33" transform="translate(11 10)" d="M42 4C60 6 96 22 97 48C98 62 80 96 50 97C28 98 2 80 3 56C4 40 22 2 42 4Z"/></svg><svg class="layer layer-white" viewBox="0 0 100 100"><path fill="currentColor" d="M42 4C60 6 96 22 97 48C98 62 80 96 50 97C28 98 2 80 3 56C4 40 22 2 42 4Z"/></svg><span class="froge-period-hit"></span></span></span></div>
  <div class="intro">
    <h1>Froge is a small game studio in California.</h1>
    <p class="lede">We're making games with our favorite people.</p>
    <p>Say hello: <a href="mailto:dean@frogegames.com">dean@frogegames.com</a></p>
  </div>
  <section class="now" aria-labelledby="now-label">
    <p class="now-label" id="now-label">Now making</p>
    <ul class="shots">
      <li><img src="img/shot-1.webp" width="720" height="1560" alt="Play your hand: a fight screen with a hand of cards."></li>
      <li><img src="img/shot-2.webp" width="720" height="1560" alt="Pick a new card: choose one of three cards to add."></li>
      <li><img src="img/shot-3.webp" width="720" height="1560" alt="Build your deck: a grid of the cards in your deck."></li>
      <li><img src="img/shot-4.webp" width="720" height="1560" alt="A new road every run: a map of stops leading to a boss."></li>
    </ul>
    <p class="now-line">A single-player deckbuilder for PC and iPhone.</p>
  </section>
  <div class="score" aria-hidden="true"><div>Pulls<b id="p" class="sea">000</b></div><div>Blobs<b id="b">000</b></div></div>
  <footer class="site-foot"><span>© 2026 Froge, LLC</span><a href="privacy.html">Privacy</a></footer>
</main>
<script src="froge.js"></script>
<script>(function(){"use strict";
  function pad(n) { return ("00" + n).slice(-3); }
  function flash(el, n) { el.textContent = pad(n); el.classList.add("hit"); setTimeout(function () { el.classList.remove("hit"); }, 420); }
  function onPull(n) { flash(document.getElementById("p"), n); }
  function onBlob(n) { flash(document.getElementById("b"), n); }
  var pulls = 0, blobs = 0, sx = 0, sy = 0, down = false;
  var hit = document.querySelector(".froge-period-hit"), mainEl = document.querySelector("main");
  hit.addEventListener("pointerdown", function (e) { down = true; sx = e.clientX; sy = e.clientY; });
  addEventListener("pointerup", function (e) {
    if (!down) return; down = false;
    if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 6) { pulls++; onPull(pulls); }
  });
  mainEl.addEventListener("click", function (e) { if (e.target === mainEl) { blobs++; onBlob(blobs); } });
})();</script>
</body>
</html>
